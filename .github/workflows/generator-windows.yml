name: Custom Windows Client Generator
run-name: Custom Windows Client Generator

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host / IP da sua VPS'
        required: true
        default: '103.204.193.138'
      port:
        description: 'Porta de IDs (padrao 21116)'
        required: true
        default: '21116'
      key:
        description: 'Chave Publica (Key)'
        required: true
        default: 'NUTUmUQphDoacwhcAFFKw4fcUkSGiRnxVUn+99xG77o='
      custom_url:
        description: 'URL Customizada (replaces rustdesk.com)'
        required: false
        default: 'https://senasystems.com.br'
      app_name:
        description: 'Nome do Aplicativo'
        required: false
        default: 'Suporte SCI'
      icon_url:
        description: 'Link direto do Icone (.png 256x256)'
        required: false
        default: ''
      logo_url:
        description: 'Link direto da Logo (.png)'
        required: false
        default: ''
      rustdesk_ref:
        description: 'Tag do RustDesk (ex: 1.4.0). Vazio = ultima tag estavel'
        required: false
        default: ''

env:
  VCPKG_ROOT: 'C:\vcpkg-rd'
  VCPKGRS_TRIPLET: 'x64-windows-static'
  VCPKG_DEFAULT_BINARY_CACHE: 'C:\vcpkg-cache'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # ------------------------------------------------------------------
      # 1. Clonar uma TAG estavel (evita quebrar com mudancas da master)
      # ------------------------------------------------------------------
      - name: Clonar RustDesk (tag estavel)
        env:
          REF_INPUT: ${{ inputs.rustdesk_ref }}
        run: |
          REF="$REF_INPUT"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/rustdesk/rustdesk.git \
              | awk '{print $2}' | sed 's|refs/tags/||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          fi
          echo "Usando RustDesk tag: $REF"
          echo "RUSTDESK_REF=$REF" >> "$GITHUB_ENV"
          git clone --recursive --depth 1 --branch "$REF" https://github.com/rustdesk/rustdesk.git ./rustdesk-source

      # ------------------------------------------------------------------
      # 2. Ler as versoes oficiais (Flutter, Rust, LLVM, vcpkg) da propria tag
      # ------------------------------------------------------------------
      - name: Ler versoes do workflow oficial
        run: |
          set +e +o pipefail
          cd ./rustdesk-source
          WF=.github/workflows/flutter-build.yml
          echo "Arquivo existe? $(test -f $WF && echo sim || echo NAO)"
          echo "--- linhas de versao encontradas no workflow oficial ---"
          grep -nE '(FLUTTER_VERSION|RUST_VERSION|LLVM_VERSION|VCPKG_COMMIT_ID|flutter_rust_bridge_codegen --version|ffigen --version):?' "$WF" | head -n 30

          getv() {
            grep -m1 -E "^\s*$1:" "$WF" 2>/dev/null | sed -E 's/^[^:]+:\s*"?([^"# ]+)"?.*/\1/'
          }

          FLUTTER_VERSION=$(getv WINDOWS_FLUTTER_VERSION)
          [ -z "$FLUTTER_VERSION" ] && FLUTTER_VERSION=$(getv FLUTTER_VERSION)
          RUST_VERSION=$(getv RUST_VERSION)
          LLVM_VERSION=$(getv LLVM_VERSION)
          VCPKG_COMMIT_ID=$(getv VCPKG_COMMIT_ID)
          [ -z "$VCPKG_COMMIT_ID" ] && VCPKG_COMMIT_ID=$(grep -m1 -oE '"builtin-baseline"\s*:\s*"[0-9a-f]+"' vcpkg.json 2>/dev/null | grep -oE '[0-9a-f]{40}')
          FRB_VERSION=$(grep -m1 -oE 'flutter_rust_bridge_codegen --version [0-9.]+' "$WF" 2>/dev/null | awk '{print $3}')
          FFIGEN_VERSION=$(grep -m1 -oE 'activate ffigen --version [0-9.]+' "$WF" 2>/dev/null | awk '{print $4}')

          # Valores de reserva
          FLUTTER_VERSION=${FLUTTER_VERSION:-3.24.5}
          RUST_VERSION=${RUST_VERSION:-1.75}
          LLVM_VERSION=${LLVM_VERSION:-15.0.6}
          FRB_VERSION=${FRB_VERSION:-1.80.1}
          FFIGEN_VERSION=${FFIGEN_VERSION:-5.0.1}

          echo "=== Versoes usadas ==="
          echo "Flutter=$FLUTTER_VERSION Rust=$RUST_VERSION LLVM=$LLVM_VERSION"
          echo "vcpkg=$VCPKG_COMMIT_ID FRB=$FRB_VERSION ffigen=$FFIGEN_VERSION"

          if [ -z "$VCPKG_COMMIT_ID" ]; then
            echo "ERRO: nao encontrei o commit do vcpkg (nem no workflow, nem em vcpkg.json)"
            exit 1
          fi
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "RUST_VERSION=$RUST_VERSION"
            echo "LLVM_VERSION=$LLVM_VERSION"
            echo "VCPKG_COMMIT_ID=$VCPKG_COMMIT_ID"
            echo "FRB_VERSION=$FRB_VERSION"
            echo "FFIGEN_VERSION=$FFIGEN_VERSION"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 3. Personalizacao (host, porta, chave, nome, links)
      # ------------------------------------------------------------------
      - name: Configurar Host, Portas, Chave e Nome
        shell: python
        env:
          SERVER: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
          KEY: ${{ inputs.key }}
          APPNAME: ${{ inputs.app_name }}
          CUSTOM_URL: ${{ inputs.custom_url }}
        run: |
          import os, re, pathlib

          server = os.environ["SERVER"].strip()
          port = int(os.environ["PORT"].strip())
          relay = port + 1
          key = os.environ["KEY"].strip()
          appname = os.environ.get("APPNAME", "").strip()
          url = os.environ.get("CUSTOM_URL", "").strip()

          root = pathlib.Path("rustdesk-source")
          cfg = root / "libs/hbb_common/src/config.rs"
          txt = cfg.read_text(encoding="utf-8")

          # Lista de servidores publicos -> apenas o seu
          txt, n1 = re.subn(
              r'(pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*)&\[.*?\];',
              lambda m: m.group(1) + '&["' + server + '"];',
              txt, flags=re.S)
          # Portas
          txt, n2 = re.subn(r'(pub const RENDEZVOUS_PORT:\s*i32\s*=\s*)\d+;',
                            lambda m: m.group(1) + str(port) + ';', txt)
          txt, n3 = re.subn(r'(pub const RELAY_PORT:\s*i32\s*=\s*)\d+;',
                            lambda m: m.group(1) + str(relay) + ';', txt)
          # Chave publica
          txt, n4 = re.subn(r'(pub const RS_PUB_KEY:\s*&str\s*=\s*)"[^"]*";',
                            lambda m: m.group(1) + '"' + key + '";', txt)
          # Nome do app
          n5 = 0
          if appname:
              txt, n5 = re.subn(r'(APP_NAME:\s*RwLock<String>\s*=\s*RwLock::new\()"[^"]*"',
                                lambda m: m.group(1) + '"' + appname + '"', txt)
          cfg.write_text(txt, encoding="utf-8")
          print(f"servers={n1} rendezvous_port={n2} relay_port={n3} key={n4} app_name={n5}")
          if n1 == 0 or n4 == 0:
              raise SystemExit("ERRO: nao encontrei RENDEZVOUS_SERVERS ou RS_PUB_KEY em config.rs")

          # ProductName no Cargo.toml (metadados do Windows)
          if appname:
              ct = root / "Cargo.toml"
              t = ct.read_text(encoding="utf-8")
              t = re.sub(r'(ProductName\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + appname + '"', t)
              t = re.sub(r'(FileDescription\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + appname + '"', t)
              ct.write_text(t, encoding="utf-8")

          # Trocar links rustdesk.com
          if url:
              for ext in ("*.dart", "*.rs"):
                  for p in root.rglob(ext):
                      if "target" in p.parts or ".git" in p.parts:
                          continue
                      try:
                          s = p.read_text(encoding="utf-8")
                      except Exception:
                          continue
                      if "https://rustdesk.com" in s:
                          p.write_text(s.replace("https://rustdesk.com", url), encoding="utf-8")

      - name: Baixar e aplicar icone e logo
        env:
          ICON_URL: ${{ inputs.icon_url }}
          LOGO_URL: ${{ inputs.logo_url }}
        run: |
          cd ./rustdesk-source
          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o ./res/icon.png
            pip install pillow
            python - <<'PY'
          from PIL import Image
          img = Image.open("res/icon.png").convert("RGBA")
          sizes = [(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]
          img.save("res/icon.ico", format="ICO", sizes=sizes)
          img.save("flutter/windows/runner/resources/app_icon.ico", format="ICO", sizes=sizes)
          PY
          fi
          if [ -n "$LOGO_URL" ]; then
            mkdir -p ./flutter/assets
            curl -fsSL "$LOGO_URL" -o ./flutter/assets/logo.png
          fi

      # ------------------------------------------------------------------
      # 4. Ferramentas
      # ------------------------------------------------------------------
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar LLVM e Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Aplicar patches do Flutter (se aplicavel)
        run: |
          FLUTTER_ROOT=$(dirname "$(dirname "$(which flutter)")")
          cd "$FLUTTER_ROOT"
          for p in "$GITHUB_WORKSPACE"/rustdesk-source/.github/patches/*.diff; do
            [ -f "$p" ] || continue
            if git apply --check "$p" 2>/dev/null; then
              echo "Aplicando $p"
              git apply "$p"
            else
              echo "Ignorando $p (nao se aplica a esta versao do Flutter)"
            fi
          done

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rustdesk-source -> target'
          key: ${{ env.RUSTDESK_REF }}

      # ------------------------------------------------------------------
      # 5. vcpkg pelo manifesto oficial (opus, libvpx, libyuv, aom, etc.)
      # ------------------------------------------------------------------
      - name: Cache do vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('rustdesk-source/vcpkg.json') }}

      - name: Instalar dependencias C++ (vcpkg)
        shell: pwsh
        run: |
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          New-Item -ItemType Directory -Force -Path C:\vcpkg-cache | Out-Null
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg-rd
          cd C:\vcpkg-rd
          git checkout $env:VCPKG_COMMIT_ID
          .\bootstrap-vcpkg.bat -disableMetrics
          cd $env:GITHUB_WORKSPACE\rustdesk-source
          C:\vcpkg-rd\vcpkg.exe install --triplet x64-windows-static --x-install-root="C:\vcpkg-rd\installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------------
      # 6. Bridge Flutter <-> Rust (obrigatorio)
      # ------------------------------------------------------------------
      - name: Gerar flutter_rust_bridge
        run: |
          cd ./rustdesk-source
          dart pub global activate ffigen --version "$FFIGEN_VERSION"
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --features "uuid" --locked
          (cd flutter && flutter pub get)
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      # ------------------------------------------------------------------
      # 7. Build
      # ------------------------------------------------------------------
      - name: Compilar RustDesk
        shell: pwsh
        run: |
          cd ./rustdesk-source
          python .\build.py --flutter
          if ($LASTEXITCODE -ne 0) {
            Write-Error "build.py falhou com codigo $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Reunir arquivos de saida
        shell: pwsh
        run: |
          $rel = "rustdesk-source\flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\rustdesk.exe")) {
            Write-Error "rustdesk.exe nao encontrado em $rel"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "$rel\*" -Destination dist -Recurse -Force
          Get-ChildItem dist | Select-Object -First 30

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: Suporte-SCI-Windows
          path: dist/
