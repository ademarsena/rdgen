name: Custom Windows Client Generator
run-name: Custom Windows Client Generator

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host / IP da sua VPS'
        required: true
        default: '103.204.193.138'
      port:
        description: 'Porta de IDs (padrao 21116)'
        required: true
        default: '21116'
      key:
        description: 'Chave Publica (Key)'
        required: true
        default: 'NUTUmUQphDoacwhcAFFKw4fcUkSGiRnxVUn+99xG77o='
      custom_url:
        description: 'URL Customizada (replaces rustdesk.com)'
        required: false
        default: 'https://senasystems.com.br'
      app_name:
        description: 'Nome do Aplicativo'
        required: false
        default: 'Suporte SCI'
      icon_url:
        description: 'Link direto do Icone (.png 256x256)'
        required: false
        default: ''
      logo_url:
        description: 'Link direto da Logo (.png)'
        required: false
        default: ''

env:
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKGRS_TRIPLET: "x64-windows-static"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clonar RustDesk com Submodulos
        shell: bash
        run: |
          git clone --recursive --depth 1 https://github.com/rustdesk/rustdesk.git ./rustdesk-source

      - name: Configurar Host, Portas e Chave no Codigo
        shell: bash
        run: |
          cd ./rustdesk-source
          SERVER="${{ inputs.host }}"
          PORT="${{ inputs.port }}"
          KEY="${{ inputs.key }}"
          RELAY_PORT=$((PORT + 1))
          
          # Injeta Host e Portas
          sed -i -e "s|rs-ny.rustdesk.com|$SERVER|" ./libs/hbb_common/src/config.rs || true
          sed -i -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $PORT;|" ./libs/hbb_common/src/config.rs || true
          sed -i -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs || true
          
          # Injeta a Chave Publica
          sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$KEY|" ./libs/hbb_common/src/config.rs || true

      - name: Customizar Links e Nome da Empresa
        shell: bash
        run: |
          cd ./rustdesk-source
          URL="${{ inputs.custom_url }}"
          APPNAME="${{ inputs.app_name }}"
          
          if [ ! -z "$URL" ]; then
            find . -name "*.dart" -exec sed -i "s|https://rustdesk.com|$URL|g" {} + || true
            find . -name "*.rs" -exec sed -i "s|https://rustdesk.com|$URL|g" {} + || true
          fi
          
          if [ ! -z "$APPNAME" ]; then
            sed -i "s|ProductName = \"RustDesk\"|ProductName = \"$APPNAME\"|g" ./Cargo.toml || true
          fi

      - name: Baixar e Aplicar Logos e Icones Customizados
        shell: pwsh
        run: |
          cd ./rustdesk-source
          if ("${{ inputs.icon_url }}" -ne "") {
            Invoke-WebRequest -Uri "${{ inputs.icon_url }}" -OutFile "./res/icon.png"
            choco install -y imagemagick.app --no-progress
            magick ./res/icon.png -define icon:auto-resize=256,128,96,64,48,32,16 ./res/icon.ico
          }
          if ("${{ inputs.logo_url }}" -ne "") {
            New-Item -ItemType Directory -Force -Path "./flutter/assets"
            Invoke-WebRequest -Uri "${{ inputs.logo_url }}" -OutFile "./flutter/assets/logo.png"
          }

      - name: Tratar PrivacyMode no build.py
        shell: python
        run: |
          import re, os
          path = "./rustdesk-source/build.py"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r"(\s+)(?:features|feature)\.append\(['\"]PrivacyMode['\"]\)", r"\1pass", content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

      - name: Desativar feature aom no scrap (Evita erro de Clang e imports)
        shell: python
        run: |
          import os

          # 1. Esvazia aom_ffi.h para nao pedir cabeçalhos ao Clang
          aom_ffi = "./rustdesk-source/libs/scrap/src/bindings/aom_ffi.h"
          if os.path.exists(aom_ffi):
              with open(aom_ffi, "w", encoding="utf-8") as f:
                  f.write("/* aom desativado */\n")

          # 2. Desativa modulo aom em libs/scrap/src/common/mod.rs
          common_mod = "./rustdesk-source/libs/scrap/src/common/mod.rs"
          if os.path.exists(common_mod):
              with open(common_mod, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = txt.replace("pub mod aom;", "/* pub mod aom; */")
              with open(common_mod, "w", encoding="utf-8") as f:
                  f.write(txt)

          # 3. Stub vazio para aom.rs
          aom_rs = "./rustdesk-source/libs/scrap/src/common/aom.rs"
          if os.path.exists(aom_rs):
              with open(aom_rs, "w", encoding="utf-8") as f:
                  f.write("// aom stub\n")

      - name: Configurar Git Buffer para o Vcpkg
        shell: bash
        run: |
          git config --global http.postBuffer 1048576000
          git config --global https.postBuffer 1048576000
          git config --global core.compression 0

      - name: Instalar Dependencias C++ no Vcpkg (opus, libvpx e libyuv)
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Executavel RustDesk
        shell: pwsh
        env:
          VCPKG_ROOT: "C:\\vcpkg"
          VCPKGRS_TRIPLET: "x64-windows-static"
        run: |
          cd ./rustdesk-source
          python3 .\build.py --flutter
          if ($LASTEXITCODE -ne 0) {
            Write-Error "O script build.py falhou com codigo de saida $LASTEXITCODE."
            exit $LASTEXITCODE
          }
          
          New-Item -ItemType Directory -Force -Path "../dist"
          $exeFiles = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "target\\debug" }
          
          if ($exeFiles.Count -gt 0) {
            foreach ($exe in $exeFiles) {
              $dir = $exe.DirectoryName
              Copy-Item -Path "$dir\*" -Destination "../dist" -Recurse -Force
              break
            }
          } else {
            Write-Error "Nenhum executavel foi gerado."
            exit 1
          }

      - name: Disponibilizar Executavel para Download
        uses: actions/upload-artifact@v4
        with:
          name: Suporte-SCI-Windows
          path: ./dist/
