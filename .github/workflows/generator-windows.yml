name: Custom Windows Client Generator
run-name: Custom Windows Client Generator

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host / IP da sua VPS'
        required: true
        default: '103.204.193.138'
      port:
        description: 'Porta de IDs (padrao 21116)'
        required: true
        default: '21116'
      key:
        description: 'Chave Publica (Key)'
        required: true
        default: 'NUTUmUQphDoacwhcAFFKw4fcUkSGiRnxVUn+99xG77o='
      custom_url:
        description: 'URL Customizada (replaces rustdesk.com)'
        required: false
        default: 'https://senasystems.com.br'
      app_name:
        description: 'Nome do Aplicativo'
        required: false
        default: 'Suporte SCI'
      icon_url:
        description: 'Link direto do Icone (.png 256x256)'
        required: false
        default: ''
      logo_url:
        description: 'Link direto da Logo (.png)'
        required: false
        default: ''
      version:
        description: 'Versao base do RustDesk'
        required: true
        default: '1.2.3'

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout RustDesk source code
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          submodules: recursive
          path: ./rustdesk-source

      - name: Configurar Host, Portas e Chave no Codigo
        shell: bash
        run: |
          cd ./rustdesk-source
          SERVER="${{ inputs.host }}"
          PORT="${{ inputs.port }}"
          KEY="${{ inputs.key }}"
          RELAY_PORT=$((PORT + 1))
          
          # Injeta Host e Portas
          sed -i -e "s|rs-ny.rustdesk.com|$SERVER|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          
          # Injeta a Chave Publica
          sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$KEY|" ./libs/hbb_common/src/config.rs

      - name: Customizar Links e Nome da Empresa
        shell: bash
        run: |
          cd ./rustdesk-source
          URL="${{ inputs.custom_url }}"
          APPNAME="${{ inputs.app_name }}"
          
          if [ ! -z "$URL" ]; then
            find . -name "*.dart" -exec sed -i "s|https://rustdesk.com|$URL|g" {} + || true
            find . -name "*.rs" -exec sed -i "s|https://rustdesk.com|$URL|g" {} + || true
          fi
          
          if [ ! -z "$APPNAME" ]; then
            sed -i "s|ProductName = \"RustDesk\"|ProductName = \"$APPNAME\"|g" ./Cargo.toml || true
          fi

      - name: Baixar e Aplicar Logos e Icones Customizados
        shell: pwsh
        run: |
          cd ./rustdesk-source
          if ("${{ inputs.icon_url }}" -ne "") {
            Invoke-WebRequest -Uri "${{ inputs.icon_url }}" -OutFile "./res/icon.png"
            choco install -y imagemagick.app --no-progress
            magick ./res/icon.png -define icon:auto-resize=256,128,96,64,48,32,16 ./res/icon.ico
          }
          if ("${{ inputs.logo_url }}" -ne "") {
            New-Item -ItemType Directory -Force -Path "./flutter/assets"
            Invoke-WebRequest -Uri "${{ inputs.logo_url }}" -OutFile "./flutter/assets/logo.png"
          }

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Compilar Executavel RustDesk
        shell: pwsh
        run: |
          cd ./rustdesk-source
          python3 .\build.py --flutter --hwcodec --exclude-features PrivacyMode
          mkdir -p ../dist
          Move-Item -Path "./flutter/build/windows/x64/runner/Release/*" -Destination "../dist"

      - name: Disponibilizar Executavel para Download
        uses: actions/upload-artifact@v4
        with:
          name: Suporte-SCI-Windows
          path: ./dist/
